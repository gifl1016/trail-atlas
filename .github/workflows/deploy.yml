name: Deploy Trail Atlas

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'backend/**'
      - 'garmin-sync/**'
      - 'scripts/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'Was deployen?'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - frontend
          - backend
          - garmin-sync
          - all

jobs:
  detect-changes:
    name: Was hat sich geändert?
    runs-on: ubuntu-latest
    outputs:
      frontend:    ${{ steps.detect.outputs.frontend }}
      backend:     ${{ steps.detect.outputs.backend }}
      garmin_sync: ${{ steps.detect.outputs.garmin_sync }}
      ops_cli:     ${{ steps.detect.outputs.ops_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: detect
        run: |
          MODE="${{ github.event.inputs.target }}"
          if [ "$MODE" = "all" ]; then
            echo "frontend=true"    >> $GITHUB_OUTPUT
            echo "backend=true"     >> $GITHUB_OUTPUT
            echo "garmin_sync=true" >> $GITHUB_OUTPUT
            echo "ops_cli=true"     >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$MODE" = "frontend" ];    then echo "frontend=true"    >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$MODE" = "backend" ];     then echo "backend=true"     >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$MODE" = "garmin-sync" ]; then echo "garmin_sync=true" >> $GITHUB_OUTPUT; exit 0; fi

          # Auto: schauen was sich seit dem letzten commit geändert hat
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          if echo "$CHANGED" | grep -qE '^src/';         then echo "frontend=true"    >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED" | grep -qE '^backend/';     then echo "backend=true"     >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED" | grep -qE '^garmin-sync/'; then echo "garmin_sync=true" >> $GITHUB_OUTPUT; fi

          # ops.sh geändert → CLI deployen
          if echo "$CHANGED" | grep -qE '^scripts/ops\.sh'; then
            echo "ops_cli=true" >> $GITHUB_OUTPUT
          fi

          # Andere Scripts geändert → alles neu deployen (sicher)
          if echo "$CHANGED" | grep -qE '^scripts/(deploy|deploy_backend|deploy_garmin_sync)\.sh'; then
            echo "frontend=true"    >> $GITHUB_OUTPUT
            echo "backend=true"     >> $GITHUB_OUTPUT
            echo "garmin_sync=true" >> $GITHUB_OUTPUT
          fi

  deploy-frontend:
    name: Deploy Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Find latest HTML
        id: latest
        run: |
          LATEST=$(git log --name-only --pretty=format: --diff-filter=AM -- 'src/*.html' \
                  | grep -E '^src/.*\.html$' | awk '!seen[$0]++' | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::Keine HTML-Datei in src/ gefunden"
            exit 1
          fi
          echo "Latest HTML: $LATEST"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Upload to VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "rm -f ~/trail-atlas/src/*.html"
          scp -i ~/.ssh/deploy_key "${{ steps.latest.outputs.latest }}" \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/src/
          scp -i ~/.ssh/deploy_key scripts/deploy.sh \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/scripts/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod +x ~/trail-atlas/scripts/deploy.sh && bash ~/trail-atlas/scripts/deploy.sh"

      - name: Health check
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.VM_HOST }}")
          echo "HTML status: $CODE"
          # 200 = OK, 401 = App-Auth aktiv (kein Basic Auth mehr) – beides gut
          [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-backend:
    name: Deploy Backend (with rollback)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload backend files
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/trail-atlas/backend ~/trail-atlas/scripts"
          scp -i ~/.ssh/deploy_key backend/* \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/backend/
          scp -i ~/.ssh/deploy_key scripts/deploy_backend.sh \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/scripts/

      - name: Deploy with auto-rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod +x ~/trail-atlas/scripts/deploy_backend.sh && bash ~/trail-atlas/scripts/deploy_backend.sh"

      - name: API health check
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.VM_HOST }}/api/health")
          echo "API status: $CODE"
          [ "$CODE" = "200" ] || exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-garmin-sync:
    name: Deploy Garmin Sync Script
    needs: detect-changes
    if: needs.detect-changes.outputs.garmin_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload sync script
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/trail-atlas/garmin-sync ~/trail-atlas/scripts"
          scp -i ~/.ssh/deploy_key garmin-sync/* \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/garmin-sync/
          scp -i ~/.ssh/deploy_key scripts/deploy_garmin_sync.sh \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/scripts/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod +x ~/trail-atlas/scripts/deploy_garmin_sync.sh && bash ~/trail-atlas/scripts/deploy_garmin_sync.sh"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-ops-cli:
    name: Deploy CLI (ops.sh)
    needs: detect-changes
    if: needs.detect-changes.outputs.ops_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload and install CLI
        run: |
          scp -i ~/.ssh/deploy_key scripts/ops.sh \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/trail-atlas/scripts/
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo cp ~/trail-atlas/scripts/ops.sh /usr/local/bin/trail-atlas && \
             sudo chmod +x /usr/local/bin/trail-atlas && \
             echo '✓ CLI installed: /usr/local/bin/trail-atlas'"

      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "trail-atlas --help | head -3"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
