# =============================================================================
# Nginx Ergänzung für Trail Atlas API
# =============================================================================
# Diesen Block in den bestehenden HTTPS server{} Block einfügen
# (in /etc/nginx/sites-available/trail-atlas, innerhalb des server { ... } Blocks)
#
# Die API ist hinter Basic Auth geschützt – gleiche Credentials wie die App.
# =============================================================================

    # ── API Proxy → FastAPI Backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts – großzügig für GPS-Import (große CSV-Dateien)
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Upload-Größe für CSV-Import (50 MB)
        client_max_body_size 50M;

        # Basic Auth (gleiche Datei wie für die App)
        auth_basic           "Trail Atlas";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Swagger UI nur von lokaler IP erreichbar (optional, entfernen wenn nicht gewünscht)
        # location /api/docs {
        #     allow 127.0.0.1;
        #     deny all;
        # }
    }
